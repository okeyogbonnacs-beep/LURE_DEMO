name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/build-windows.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy[base] kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle pyinstaller

      - name: Build EXE
        working-directory: LURE_DEMO
        shell: pwsh
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          $ErrorActionPreference = "Stop"
          try {
            pyinstaller lure.spec
          } catch {
            Write-Host "First build attempt failed, retrying..."
            Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
            pyinstaller lure.spec
          }

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LURE-Windows
          path: LURE_DEMO/dist/LURE

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: LURE_DEMO/build/LURE/*.txt
